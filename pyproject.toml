[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torch2jax"
# Don't forget to also update the version in flake.nix!
version = "0.1.0"
authors = [
  { name="Samuel Ainsworth", email="skainsworth@gmail.com" },
]
description = "Run PyTorch in JAX. 🤝"
readme = "README.md"
dependencies = ["einops", "flax", "jax", "torch"]

[project.urls]
"Homepage" = "https://github.com/samuela/torch2jax"
"Bug Tracker" = "https://github.com/samuela/torch2jax/issues"

[tool.setuptools]
packages = ["torch2jax"]

[tool.ruff]
# Ruff 0.16 began formatting fenced Python snippets in Markdown files.
extend-exclude = ["*.md"]
# Keep the lint rule families stable as the CI Nix channel updates Ruff.
lint.select = ["E4", "E7", "E9", "F", "I"]

# E731 Do not assign a `lambda` expression, use a `def`
lint.ignore = ["E731"]
indent-width = 2
line-length = 120
